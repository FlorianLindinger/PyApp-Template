# Pyrefly settings for the launcher (this DONT_CHANGE folder only). Pyrefly uses the closest
# configuration file, so the app's own code keeps the developer's settings.

preset = "strict"
project-includes = ["**/*.py"]
# The launcher imports itself as "pyapp.DONT_CHANGE...", from the code folder.
# runtime: script_wrapper.py imports "_pyapp" from its own folder; tests and pyapp_tools/src: their shared helper modules.
search-path = ["../..", "bootstrap", "runtime", "tests", "pyapp_tools/src"]
# It runs on every Python uv can install on Windows, from 3.8 on, with the standard library only
# (no packages of the app's environment), so check against 3.8 without querying an interpreter.
python-version = "3.8"
python-platform = "windows"
skip-interpreter-query = true

# On top of "strict": the checks of the "all" preset that find real problems in this code.
# The rest of "all" mostly flags deliberate patterns (if items:, ignored call results, Any
# for JSON and Windows API values) and would add noise, not safety.
[errors]
unused-type-ignore = "error"       # a suppression comment that no longer suppresses anything
untyped-namedtuple = "error"       # namedtuple fields without types (use typing.NamedTuple)
not-required-key-access = "error"  # reading an optional TypedDict key without checking it
