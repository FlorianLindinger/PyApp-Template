# Pyrefly settings for the launcher (this DONT_CHANGE folder only). Pyrefly uses the closest
# configuration file, so the app's own code keeps the developer's settings.

project-includes = ["**/*.py"]
# The launcher imports itself as "backend.DONT_CHANGE...", from the code folder.
search-path = ["../..", "runtime"]  # runtime: script_wrapper.py imports "_pyapp" from its own folder
# It runs on every Python uv can install on Windows, from 3.8 on, with the standard library only
# (no packages of the app's environment), so check against 3.8 without querying an interpreter.
python-version = "3.8"
python-platform = "windows"
skip-interpreter-query = true
