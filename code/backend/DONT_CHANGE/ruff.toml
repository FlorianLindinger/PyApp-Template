# Ruff settings for the launcher (this DONT_CHANGE folder only). Ruff uses the closest
# configuration file, so the app's own code (code/main.py, ...) keeps the developer's settings.

# The launcher runs on every Python uv can install on Windows, from 3.8 on (see README.md).
target-version = "py38"
line-length = 120

[lint]
# Include pathlib and security diagnostics in verification, alongside Ruff's defaults.
extend-select = ["PTH", "S"]
# Deliberate patterns of this code base:
ignore = [
    # Catch-all excepts are intentional: cosmetic steps (window icon, colors, focus, ...) must
    # never stop the app. They are recorded with diagnostics.note_ignored() instead.
    "BLE001", # blind-except
]
