name: Weekly check against the newest uv and Python

on:
  schedule:
    - cron: "17 4 * * 1"  # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # Runs in the template and its forks. Apps made from the template have another repository name, so they skip it.
    if: endsWith(github.repository, '/PyApp-Template')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest
          enable-cache: false
      - name: Tests on Python 3.8 and the newest Python
        run: uv run --no-project --python 3.14 python code/pyapp/DONT_CHANGE/pyapp_tools/src/test_all_pythons.py

  fresh-clone:
    if: endsWith(github.repository, '/PyApp-Template')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest
          enable-cache: false
      - name: Clone, run Setup and start the launcher
        run: uv run --no-project --python 3.14 python code/pyapp/DONT_CHANGE/pyapp_tools/src/fresh_clone_test.py

  # GitHub pauses scheduled workflows after 60 days without activity in the repository.
  keepalive:
    if: endsWith(github.repository, '/PyApp-Template')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep this schedule from being paused
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pyapp-template-weekly.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
