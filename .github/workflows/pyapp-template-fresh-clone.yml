name: Fresh clone

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-clone:
    # Runs in the template and its forks. Apps made from the template have another repository name, so they skip it.
    if: endsWith(github.repository, '/PyApp-Template')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - name: Clone, run Setup and start the launcher
        run: uv run --no-project --python 3.14 python code/pyapp/DONT_CHANGE/template_tools/src/fresh_clone_test.py
