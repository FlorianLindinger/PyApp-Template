name: Launcher tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # Runs in the template and its forks. Apps made from the template have another repository name, so they skip it.
    if: endsWith(github.repository, '/PyApp-Template')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - name: Tests on Python 3.8 and the newest Python
        run: uv run --no-project --python 3.14 python code/backend/DONT_CHANGE/scripts/tools/test_all_pythons.py
      - name: Ruff and Pyrefly
        if: ${{ !cancelled() }}
        run: uv run --no-project --python 3.14 python code/backend/DONT_CHANGE/scripts/tools/verify_launcher.py
